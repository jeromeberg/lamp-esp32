
esphome:
  name: lamp-esp32
  friendly_name: Lamp ESP32

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Smart Lamp Setup"

captive_portal:

# --------------------------------------
# State
# --------------------------------------
globals:
  - id: lamp_mode
    type: int
    restore_value: yes
    initial_value: '2'
    # 0 = Yellow
    # 1 = White
    # 2 = Both

# --------------------------------------
# PWM outputs
# --------------------------------------
output:
  - platform: ledc
    id: yellow_pwm
    pin: GPIO4
    frequency: 1000 Hz

  - platform: ledc
    id: white_pwm
    pin: GPIO5
    frequency: 1000 Hz

# --------------------------------------
# Light entity
# --------------------------------------
light:
  - platform: cwww
    id: lamp
    name: "Lamp"
    warm_white: yellow_pwm
    cold_white: white_pwm
    warm_white_color_temperature: 3000 K
    cold_white_color_temperature: 6000 K
    constant_brightness: false
    restore_mode: RESTORE_DEFAULT_OFF
    default_transition_length: 200ms

# --------------------------------------
# Apply current lighting mode
# --------------------------------------
script:
  - id: apply_mode
    mode: restart
    then:
      - if:
          condition:
            light.is_on: lamp
          then:
            - if:
                condition:
                  lambda: 'return id(lamp_mode) == 0;'
                then:
                  - light.turn_on:
                      id: lamp
                      warm_white: 100%
                      cold_white: 0%

            - if:
                condition:
                  lambda: 'return id(lamp_mode) == 1;'
                then:
                  - light.turn_on:
                      id: lamp
                      warm_white: 0%
                      cold_white: 100%

            - if:
                condition:
                  lambda: 'return id(lamp_mode) == 2;'
                then:
                  - light.turn_on:
                      id: lamp
                      warm_white: 100%
                      cold_white: 100%

# --------------------------------------
# Physical buttons
# --------------------------------------
binary_sensor:

  # Main button
  - platform: gpio
    id: main_button
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on_off: 20ms

    # Short press: change mode
    on_click:
      - min_length: 50ms
        max_length: 500ms
        then:
          - lambda: |-
              id(lamp_mode) = (id(lamp_mode) + 1) % 3;
          - script.execute: apply_mode

    # Long press: toggle lamp
    on_multi_click:
      - timing:
          - ON for at least 800ms
        then:
          - light.toggle: lamp

  # Plus button
  - platform: gpio
    id: plus_button
    pin:
      number: GPIO3
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on_off: 20ms

    on_press:
      then:
        - if:
            condition:
              light.is_on: lamp
            then:
              - light.dim_relative:
                  id: lamp
                  relative_brightness: 10%
                  transition_length: 200ms

  # Minus button
  - platform: gpio
    id: minus_button
    pin:
      number: GPIO1
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on_off: 20ms

    on_press:
      then:
        - if:
            condition:
              light.is_on: lamp
            then:
              - light.dim_relative:
                  id: lamp
                  relative_brightness: -10%
                  transition_length: 200ms

